name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master

# A newer push to master makes an in-flight run pointless: it would verify and
# deploy a commit that is already behind.
concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build_and_deploy:
    # The gate. Every check in `verify` has to pass before anything reaches the
    # live channel — a red suite means the build is not fit to ship, so there
    # is nothing to think about here.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIFT_TRACKER_E4A9C }}'
          projectId: lift-tracker-e4a9c
          channelId: live
