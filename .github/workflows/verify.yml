name: Verify

# A reusable workflow rather than a copy in each pipeline.
#
# Both the merge and the pull-request pipelines need exactly these gates before
# they deploy, and `workflow_call` lets them share one definition. Separate
# top-level workflows were the alternative and are worse for this: nothing in
# one workflow can *depend* on another, so a deploy would either start
# regardless or need `workflow_run` gymnastics that run against the default
# branch's definition and cannot block the pull request's own checks.
on:
  workflow_call:

jobs:
  # Everything that needs nothing but node. Fast, and the first thing to fail
  # on an ordinary mistake.
  checks:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The security rules, against the real emulator (Appendix A). Its own job so
  # it runs beside the others and gets its own emulator: the suite clears
  # Firestore between cases, which would wipe the e2e run's data if they shared
  # one.
  rules:
    name: security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules:ci

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Only chromium: the suite runs one project, a Pixel 7 profile.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ci
      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
