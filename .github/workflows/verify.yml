name: Verify

# A reusable workflow rather than a copy in each pipeline.
#
# Both the merge and the pull-request pipelines need exactly these gates before
# they deploy, and `workflow_call` lets them share one definition. Separate
# top-level workflows were the alternative and are worse for this: nothing in
# one workflow can *depend* on another, so a deploy would either start
# regardless or need `workflow_run` gymnastics that run against the default
# branch's definition and cannot block the pull request's own checks.
on:
  workflow_call:

jobs:
  # Everything that needs nothing but node. Fast, and the first thing to fail
  # on an ordinary mistake.
  checks:
    name: typecheck · lint · unit · build · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      # Reads apps/web/dist/ and fails on a §3 budget regression. Here rather than in
      # its own workflow because it is deterministic — same commit, same bytes,
      # same verdict — so it is fit to block a deploy.
      - run: pnpm run size

  # The security rules, against the real emulator (Appendix A). Its own job so
  # it runs beside the others and gets its own emulator: the suite clears
  # Firestore between cases, which would wipe the e2e run's data if they shared
  # one.
  rules:
    name: security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The phone app's packages (Expo, React Native) are not needed here.
      - run: pnpm install --frozen-lockfile --filter '!@lift/mobile'
      - run: pnpm run test:rules:ci
