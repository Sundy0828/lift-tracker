name: End-to-end

# Its own top-level workflow, and that is the whole point.
#
# `verify.yml` is a reusable workflow because both deploy pipelines *depend* on
# it: nothing ships unless typecheck, lint, unit tests, build and the security
# rules all pass. The end-to-end suite is deliberately not in that set. It
# drives a real browser against real emulators, takes around ten minutes, and
# leans on gesture timing that can wobble — so gating a deploy on it would mean
# a slow release at best and a blocked one over a flake at worst.
#
# Run separately, it reports its own check on the commit and the pull request
# and holds nothing up. A red run here is a signal to go and look, not a
# barrier: the live deploy and the preview deploy both proceed on `verify`
# alone.
# PAUSED 2026-10-02: manual runs only. On CI (not locally) the run hangs
# after the last workouts test, reproducibly, holding the runner until the job
# limit. Restore the push/pull_request triggers below once that is fixed.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  #   paths-ignore:
  #     - '**/*.md'
  #     - 'docs/**'
  #     - '.env.example'
  #     - '.gitignore'
  #     - 'apps/web/lighthouserc.cjs'
  # pull_request:
  #   paths-ignore:
  #     - '**/*.md'
  #     - 'docs/**'
  #     - '.env.example'
  #     - '.gitignore'
  #     - 'apps/web/lighthouserc.cjs'

# A newer commit on the same ref makes an in-flight run pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # The suite takes under ten minutes. Without a cap, a hung browser holds
    # the runner for GitHub's six-hour default (it did, on 2026-09-29).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # The Firestore and Auth emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The phone app's packages (Expo, React Native) are not needed here.
      - run: pnpm install --frozen-lockfile --filter '!@lift/mobile'
      # Only chromium: the suite runs one project, a Pixel 7 profile.
      - run: pnpm --filter @lift/web exec playwright install --with-deps chromium
      - run: pnpm run e2e:ci
      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
