<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Lift Tracker</title>
    <meta name="description" content="Plan, log, and review your lifting sessions." />
    <meta name="theme-color" content="#12100f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Applies the color scheme before first paint so a launch never flashes
      // white. Dark is the default; a stored choice wins.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'auto'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : 'dark';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          /* private mode: fall through to Mantine's runtime default */
        }
      })();
    </script>
    <style>
      /*
        The splash, inline so it paints with the document.

        The app is client-rendered, so without this the screen stays blank
        until the entry bundle has downloaded, parsed and mounted React — on a
        throttled mobile profile that is most of the LCP budget in §3 spent on
        nothing. The Mantine stylesheet is render-blocking and sits in this
        same head, so `--mantine-color-body` already resolves here and the
        splash matches the app it hands over to; the literals are the same
        values, for the dev server where the stylesheet arrives with the JS.
      */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background-color: var(--mantine-color-body, #fff);
        color: var(--mantine-color-text, #000);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      [data-mantine-color-scheme='dark'] #splash {
        background-color: var(--mantine-color-body, #242424);
        color: var(--mantine-color-text, #c9c9c9);
      }

      #splash-title {
        margin: 0;
        font-size: 2.25rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      #splash-spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid currentcolor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.45;
        animation: splash-spin 0.8s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Removed once React has painted; see src/app/splash.ts. -->
    <div id="splash">
      <p id="splash-title">Lift Tracker</p>
      <div id="splash-spinner" role="status" aria-label="Loading"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
