<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Lift Tracker</title>
    <meta name="description" content="Plan, log, and review your lifting sessions." />
    <meta name="theme-color" content="#12100f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Applies the stored color scheme before first paint so a dark-mode
      // launch never flashes white. Mirrors Mantine's ColorSchemeScript.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          /* private mode: fall through to Mantine's runtime default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
